name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to keep the app awake
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Community Cloud App
        env:
          APP_URL: "https://thp-milklab-dvz3qzshiourxwpkpvl9ph.streamlit.app"
        run: |
          echo "Pinging Streamlit App at: $APP_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$APP_URL" || echo "failed")
          echo "Response Status: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 307 ] || [ "$STATUS_CODE" -eq 302 ]; then
            echo "✅ Streamlit App is awake and healthy!"
          else
            echo "⚠️ Streamlit App responded with status: $STATUS_CODE"
          fi
