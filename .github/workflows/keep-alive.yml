name: Keep HuggingFace Space Alive

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to prevent Space from sleeping
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App on Hugging Face
        env:
          HF_USERNAME: ${{ vars.HF_USERNAME || secrets.HF_USERNAME || 'thanyaphat' }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'thp-milklab' }}
        run: |
          SPACE_URL="https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space"
          echo "Pinging Space at: $SPACE_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$SPACE_URL" || echo "failed")
          echo "Response Status: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 307 ]; then
            echo "✅ Space is awake and healthy!"
          else
            echo "⚠️ Space responded with status: $STATUS_CODE"
          fi
